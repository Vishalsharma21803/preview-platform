server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Same-origin public reads only. The host API remains independently authenticated.
  location /api/ {
    limit_except GET { deny all; }
    proxy_pass http://host.docker.internal:18081;
    proxy_set_header Host $host;
  }

  location = /healthz {
    limit_except GET { deny all; }
    proxy_pass http://host.docker.internal:18081;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
